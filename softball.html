<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>慢壘打擊手札</title>
  
  <!-- 加入主畫面相關設定 (PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="慢壘手札">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/su-family-kh/png-gallery/refs/heads/main/sotfball-logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel 獨立版，用於在瀏覽器編譯 React -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* iOS 安全區域防護 */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
    .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    /* 隱藏捲軸但保留滾動 */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-black">
  <div id="root"></div>

  <!-- React 應用程式碼 -->
  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // SVG 圖示元件替換 (Lucide)
    const ClipboardList = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>;
    const HistoryIcon = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
    const BarChart2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>;
    const Plus = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>;
    const Trash2 = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const TrendingUp = ({className, style}) => <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
    const Pencil = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>;
    const ChevronRight = ({className}) => <svg className={className} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>;

    // Firebase 初始設定
    const firebaseConfig = {
      apiKey: "AIzaSyBWU2hkO1hxwUR0T_0Z00ALH1jYxuAxI0Q",
      authDomain: "softball-346cd.firebaseapp.com",
      projectId: "softball-346cd",
      storageBucket: "softball-346cd.firebasestorage.app",
      messagingSenderId: "370646476088",
      appId: "1:370646476088:web:9908901dd41e3d5a958dcd",
      measurementId: "G-SKPYW4D6FW"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const TEAM_ID = "softball-team-shared-001";

    // ⭐ 集中管理預設球隊 (更換球隊時只需修改這裡)
    const PRESET_TEAMS = ['幸福家', '蔡淑惠'];

    const OUTCOMES = {
      '1B': { label: '一安', bgColor: 'bg-green-100', textColor: 'text-green-700', borderColor: 'border-green-300', activeBg: 'bg-green-500', activeText: 'text-white' },
      '2B': { label: '二安', bgColor: 'bg-green-100', textColor: 'text-green-700', borderColor: 'border-green-300', activeBg: 'bg-green-500', activeText: 'text-white' },
      '3B': { label: '三安', bgColor: 'bg-green-100', textColor: 'text-green-700', borderColor: 'border-green-300', activeBg: 'bg-green-500', activeText: 'text-white' },
      'HR': { label: '全壘打', bgColor: 'bg-green-100', textColor: 'text-green-700', borderColor: 'border-green-300', activeBg: 'bg-green-600', activeText: 'text-white' },
      'GO': { label: '滾地出局', bgColor: 'bg-red-100', textColor: 'text-red-700', borderColor: 'border-red-300', activeBg: 'bg-red-500', activeText: 'text-white' },
      'FO': { label: '飛球出局', bgColor: 'bg-red-100', textColor: 'text-red-700', borderColor: 'border-red-300', activeBg: 'bg-red-500', activeText: 'text-white' },
      'DP': { label: '雙殺打', bgColor: 'bg-red-200', textColor: 'text-red-800', borderColor: 'border-red-400', activeBg: 'bg-red-700', activeText: 'text-white' },
      'K':  { label: '三振', bgColor: 'bg-red-100', textColor: 'text-red-700', borderColor: 'border-red-300', activeBg: 'bg-red-600', activeText: 'text-white' },
      'FC': { label: '野手選擇', bgColor: 'bg-orange-100', textColor: 'text-orange-700', borderColor: 'border-orange-300', activeBg: 'bg-orange-500', activeText: 'text-white' },
      'BB': { label: '四壞保送', bgColor: 'bg-blue-100', textColor: 'text-blue-700', borderColor: 'border-blue-300', activeBg: 'bg-blue-500', activeText: 'text-white' },
      'SF': { label: '犧打', bgColor: 'bg-yellow-100', textColor: 'text-yellow-700', borderColor: 'border-yellow-400', activeBg: 'bg-yellow-500', activeText: 'text-white' },
      'E':  { label: '失誤上壘', bgColor: 'bg-gray-100', textColor: 'text-gray-700', borderColor: 'border-gray-300', activeBg: 'bg-gray-500', activeText: 'text-white' },
    };

    function App() {
      const [activeTab, setActiveTab] = useState('record');
      const [records, setRecords] = useState([]);
      const [user, setUser] = useState(null);
      const [isSaving, setIsSaving] = useState(false);
      
      useEffect(() => {
        const initAuth = async () => {
          try { await signInAnonymously(auth); } catch (e) { console.error("Auth error:", e); }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!user) return;
        const recordsRef = collection(db, 'artifacts', TEAM_ID, 'public', 'data', 'records');
        const unsubscribe = onSnapshot(recordsRef, (snapshot) => {
          const loadedRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          loadedRecords.sort((a, b) => b.timestamp - a.timestamp);
          setRecords(loadedRecords);
        });
        return () => unsubscribe();
      }, [user]);

      const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
      // 使用 PRESET_TEAMS 動態設定預設選中球隊
      const [selectedTeam, setSelectedTeam] = useState(PRESET_TEAMS[0] || '自訂');
      const [customTeam, setCustomTeam] = useState('');
      const [selectedOutcome, setSelectedOutcome] = useState(null);
      const [rbi, setRbi] = useState(0);

      const [isEditing, setIsEditing] = useState(false);
      const [editingId, setEditingId] = useState(null);

      // 動態找出過去曾經記錄過的「自訂球隊」
      const recentCustomTeams = useMemo(() => {
        const defaults = [...PRESET_TEAMS, '自訂', '未分類'];
        const uniqueTeams = new Set();
        records.forEach(r => {
          if (r.team && !defaults.includes(r.team)) {
            uniqueTeams.add(r.team);
          }
        });
        return Array.from(uniqueTeams);
      }, [records]);

      // 數據檢視與下鑽狀態
      const [statsView, setStatsView] = useState('team');
      const [statDrillTeam, setStatDrillTeam] = useState(null);
      const [statDrillMonth, setStatDrillMonth] = useState(null);
      const [statDrillOverallMonth, setStatDrillOverallMonth] = useState(null);
      const [statDrillYear, setStatDrillYear] = useState(null);
      const [statDrillYearMonth, setStatDrillYearMonth] = useState(null);

      const handleViewChange = (view) => {
        setStatsView(view);
        setStatDrillTeam(null);
        setStatDrillMonth(null);
        setStatDrillOverallMonth(null);
        setStatDrillYear(null);
        setStatDrillYearMonth(null);
      };

      const formatName = (name) => {
        if (!name) return name;
        const match = name.match(/^(.*?)[(（](.*?)[)）]?$/);
        if (match && match[1].trim() !== '') {
          return (
            <div className="flex flex-col justify-center">
              <span>{match[1].trim()}</span>
              {match[2].trim() && (
                <span className="text-[11px] text-[#8E8E93] font-normal leading-tight mt-0.5">{match[2].trim()}</span>
              )}
            </div>
          );
        }
        return <span>{name}</span>;
      };

      const calculateStats = (recordsToProcess, keyExtractor) => {
        const grouped = {};
        recordsToProcess.forEach(r => {
          const key = keyExtractor(r);
          if(!key) return;
          if (!grouped[key]) {
            grouped[key] = { PA: 0, AB: 0, H: 0, '1B': 0, '2B': 0, '3B': 0, HR: 0, BB: 0, SF: 0, K: 0, RBI: 0 };
          }
          const p = grouped[key];
          p.PA += 1;
          p.RBI += r.rbi || 0;

          if (r.outcome === '1B') { p['1B']++; p.H++; p.AB++; }
          else if (r.outcome === '2B') { p['2B']++; p.H++; p.AB++; }
          else if (r.outcome === '3B') { p['3B']++; p.H++; p.AB++; }
          else if (r.outcome === 'HR') { p.HR++; p.H++; p.AB++; }
          // 保留 LO 以防舊資料，加入 DP 到出局計算
          else if (['GO', 'FO', 'LO', 'DP', 'K', 'E', 'FC'].includes(r.outcome)) { p.AB++; }

          if (r.outcome === 'K') p.K++;
          if (r.outcome === 'BB') p.BB++;
          if (r.outcome === 'SF') p.SF++;
        });

        return Object.entries(grouped).map(([name, s]) => {
          const avg = s.AB > 0 ? (s.H / s.AB) : 0;
          const obp = s.PA > 0 ? ((s.H + s.BB) / (s.AB + s.BB + s.SF)) : 0;
          const slg = s.AB > 0 ? ((s['1B'] + 2 * s['2B'] + 3 * s['3B'] + 4 * s.HR) / s.AB) : 0;
          const ops = obp + slg;

          return {
            name, ...s,
            AVG: avg.toFixed(3).replace(/^0+/, ''),
            OBP: obp.toFixed(3).replace(/^0+/, ''),
            SLG: slg.toFixed(3).replace(/^0+/, ''),
            OPS: ops.toFixed(3).replace(/^0+/, '')
          };
        });
      };

      const teamStats = useMemo(() => calculateStats(records, r => r.team || '未分類').sort((a, b) => parseFloat(b.OPS || 0) - parseFloat(a.OPS || 0)), [records]);
      const teamMonthlyStats = useMemo(() => calculateStats(records.filter(r => r.team === statDrillTeam), r => r.date ? r.date.substring(0, 7) : null).sort((a, b) => a.name.localeCompare(b.name)), [records, statDrillTeam]);
      const teamDailyStats = useMemo(() => calculateStats(records.filter(r => r.team === statDrillTeam && r.date && r.date.startsWith(statDrillMonth)), r => r.date).sort((a, b) => a.name.localeCompare(b.name)), [records, statDrillTeam, statDrillMonth]);

      const overallMonthlyStats = useMemo(() => calculateStats(records, r => r.date ? r.date.substring(0, 7) : null).sort((a, b) => a.name.localeCompare(b.name)), [records]);
      const monthTeamStats = useMemo(() => calculateStats(records.filter(r => r.date && r.date.startsWith(statDrillOverallMonth)), r => r.team || '未分類').sort((a, b) => parseFloat(b.OPS || 0) - parseFloat(a.OPS || 0)), [records, statDrillOverallMonth]);

      const overallYearlyStats = useMemo(() => calculateStats(records, r => r.date ? r.date.substring(0, 4) : null).sort((a, b) => a.name.localeCompare(b.name)), [records]);
      const yearMonthlyStats = useMemo(() => calculateStats(records.filter(r => r.date && r.date.startsWith(statDrillYear)), r => r.date ? r.date.substring(0, 7) : null).sort((a, b) => a.name.localeCompare(b.name)), [records, statDrillYear]);
      const yearMonthTeamStats = useMemo(() => calculateStats(records.filter(r => r.date && r.date.startsWith(statDrillYearMonth)), r => r.team || '未分類').sort((a, b) => parseFloat(b.OPS || 0) - parseFloat(a.OPS || 0)), [records, statDrillYearMonth]);

      // 分組長條圖
      const renderGroupedBarChart = (data) => {
        if (data.length === 0) return null;
        const metrics = [{ key: 'AVG', label: 'AVG' }, { key: 'OBP', label: 'OBP' }, { key: 'OPS', label: 'OPS' }];
        const palette = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF3B30', '#5AC8FA', '#5856D6', '#FF2D55'];
        let maxVal = 0;
        data.forEach(d => { maxVal = Math.max(maxVal, parseFloat(d.AVG) || 0, parseFloat(d.OBP) || 0, parseFloat(d.OPS) || 0); });
        maxVal = Math.ceil((maxVal + 0.1) * 10) / 10; 
        if (maxVal < 1) maxVal = 1;
        const width = 320, height = 160, paddingX = 35, paddingY = 20;
        const chartWidth = width - paddingX * 2, chartHeight = height - paddingY * 2;
        const groupWidth = chartWidth / metrics.length;
        const barWidth = Math.min((groupWidth * 0.7) / Math.max(data.length, 1), 14);
        const barSpacing = 2;

        return (
          <div className="bg-white p-4 rounded-[1.25rem]">
            <div className="mb-4">
              <h3 className="font-semibold text-black text-[14px] flex items-center gap-2 mb-2.5"><BarChart2 className="w-4 h-4 text-[#8E8E93]" /> 綜合數據比較</h3>
              <div className="flex flex-wrap gap-x-3 gap-y-1.5 text-[10px] font-medium">
                {data.map((d, i) => {
                  let label = d.name;
                  const match = label.match(/^(.*?)(?:[(（].*?[)）]?)?$/);
                  if (match && match[1]) label = match[1].trim();
                  return (
                    <div key={`legend-${i}`} className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-[3px]" style={{ backgroundColor: palette[i % palette.length] }}></span><span className="text-[#8E8E93]">{label}</span>
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="w-full overflow-visible">
               <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
                {[0, 0.5, 1].map(ratio => {
                  const y = height - paddingY - (chartHeight * ratio);
                  const val = (maxVal * ratio).toFixed(3).replace(/^0+/, '');
                  return (
                    <g key={`grid-${ratio}`}>
                      <line x1={paddingX} y1={y} x2={width-paddingX} y2={y} stroke="#E5E5EA" strokeDasharray={ratio > 0 ? "4 4" : ""} />
                      <text x={paddingX - 5} y={y + 3} fontSize="10" fill="#8E8E93" textAnchor="end">{ratio === 0 ? '.000' : val}</text>
                    </g>
                  );
                })}
                {metrics.map((m, i) => {
                  const groupCenterX = paddingX + (i * groupWidth) + (groupWidth / 2);
                  const totalBarsWidth = data.length * barWidth + (data.length - 1) * barSpacing;
                  const startX = groupCenterX - (totalBarsWidth / 2);
                  return (
                    <g key={`group-${m.key}`}>
                      {data.map((d, j) => {
                        const val = parseFloat(d[m.key]) || 0;
                        const barH = (val / maxVal) * chartHeight;
                        const x = startX + j * (barWidth + barSpacing);
                        const y = height - paddingY - barH;
                        return <rect key={`bar-${i}-${j}`} x={x} y={y} width={barWidth} height={barH} fill={palette[j % palette.length]} rx="2" />;
                      })}
                      <text x={groupCenterX} y={height - 2} fontSize="11" fill="#8E8E93" fontWeight="600" textAnchor="middle">{m.key}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      };

      const renderLineChart = (data, dataKey, title, color) => {
        if (data.length < 2) return null;
        const values = data.map(d => parseFloat(d[dataKey]) || 0);
        const maxVal = Math.max(...values) + 0.05;
        const minVal = Math.max(0, Math.min(...values) - 0.05);
        const range = maxVal - minVal || 1;
        const width = 300, height = 100, paddingX = 30, paddingY = 20;
        const points = data.map((d, i) => {
          const x = paddingX + (i / (data.length - 1)) * (width - 2 * paddingX);
          const y = height - paddingY - ((parseFloat(d[dataKey]) || 0) - minVal) / range * (height - 2 * paddingY);
          return `${x},${y}`;
        }).join(' ');

        return (
          <div className="bg-white p-4 rounded-[1.25rem]">
            <h3 className="font-semibold text-black mb-3 text-[14px] flex items-center gap-2">
              <TrendingUp className="w-4 h-4" style={{ color: color }} /> {title}
            </h3>
            <div className="w-full overflow-visible">
               <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
                <line x1={paddingX} y1={paddingY} x2={width-paddingX} y2={paddingY} stroke="#E5E5EA" />
                <line x1={paddingX} y1={height-paddingY} x2={width-paddingX} y2={height-paddingY} stroke="#E5E5EA" />
                <text x="0" y={paddingY + 3} fontSize="10" fill="#8E8E93">{maxVal.toFixed(3).replace(/^0+/, '')}</text>
                <text x="0" y={height - paddingY + 3} fontSize="10" fill="#8E8E93">{minVal.toFixed(3).replace(/^0+/, '')}</text>
                <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                {data.map((d, i) => {
                  const val = parseFloat(d[dataKey]) || 0;
                  const x = paddingX + (i / (data.length - 1)) * (width - 2 * paddingX);
                  const y = height - paddingY - (val - minVal) / range * (height - 2 * paddingY);
                  const label = d.name.length > 7 ? d.name.substring(5) : d.name.substring(5);
                  return (
                    <g key={i}>
                      <circle cx={x} cy={y} r="3.5" fill="white" stroke={color} strokeWidth="2" />
                      <text x={x} y={height + 10} fontSize="9" fill="#8E8E93" textAnchor="middle">{label}</text>
                      <text x={x} y={y - 8} fontSize="9" fill={color} textAnchor="middle" fontWeight="600">{d[dataKey]}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      };

      const handleEditClick = (record) => {
        setIsEditing(true); setEditingId(record.id); setSelectedDate(record.date);
        // 使用 PRESET_TEAMS 判斷是否為預設球隊
        if (PRESET_TEAMS.includes(record.team)) { setSelectedTeam(record.team); setCustomTeam(''); } 
        else { setSelectedTeam('自訂'); setCustomTeam(record.team); }
        // 為了相容舊版，如果是 LO，編輯時改顯示為 FO
        setSelectedOutcome(record.outcome === 'LO' ? 'FO' : record.outcome); setRbi(record.rbi || 0); setActiveTab('record');
      };

      const handleCancelEdit = () => {
        setIsEditing(false); setEditingId(null); setSelectedOutcome(null); setRbi(0); setActiveTab('history');
      };

      const handleSaveRecord = async () => {
        const finalTeam = selectedTeam === '自訂' ? customTeam.trim() : selectedTeam;
        if (!finalTeam || !selectedOutcome || !selectedDate || !user) return;
        setIsSaving(true);
        try {
          if (isEditing && editingId) {
            const docRef = doc(db, 'artifacts', TEAM_ID, 'public', 'data', 'records', editingId);
            await updateDoc(docRef, { date: selectedDate, team: finalTeam, outcome: selectedOutcome, rbi: rbi });
            setIsEditing(false); setEditingId(null); setSelectedOutcome(null); setRbi(0); setActiveTab('history');
          } else {
            const newRecord = { date: selectedDate, team: finalTeam, outcome: selectedOutcome, rbi: rbi, timestamp: Date.now() };
            await addDoc(collection(db, 'artifacts', TEAM_ID, 'public', 'data', 'records'), newRecord);
            setSelectedOutcome(null); setRbi(0);
          }
        } catch (error) { console.error("儲存失敗:", error); } finally { setIsSaving(false); }
      };

      const handleDeleteRecord = async (id) => {
        if (!user) return;
        // ⭐ 增加刪除防呆確認
        const confirmDelete = window.confirm("確定要刪除這筆記錄嗎？這項操作無法復原。");
        if (!confirmDelete) return;

        try { await deleteDoc(doc(db, 'artifacts', TEAM_ID, 'public', 'data', 'records', id)); } catch (e) { console.error(e); }
      };

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto bg-[#F2F2F7] overflow-hidden font-[system-ui,-apple-system,sans-serif]">
          <header className="bg-white/80 backdrop-blur-md text-black pt-safe pb-3 px-4 border-b border-[#E5E5EA] z-10 flex items-end justify-center relative h-[60px] shrink-0">
            <h1 className="text-[17px] font-semibold leading-tight">慢壘打擊手札</h1>
          </header>

          <main className="flex-1 overflow-y-auto pb-24 px-4 pt-4">
            
            {/* RECORD TAB */}
            {activeTab === 'record' && (
              <div className="space-y-4 animate-in fade-in duration-300">
                <div className="bg-white rounded-[1.25rem] overflow-hidden">
                  <div className="flex items-center justify-between p-4 border-b border-[#E5E5EA]">
                    <span className="text-[17px] text-black">日期</span>
                    <input type="date" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} className="text-[17px] text-[#007AFF] bg-transparent outline-none text-right appearance-none" />
                  </div>
                  <div className="p-4">
                    <span className="text-[17px] text-black block mb-3">球隊</span>
                    <div className="flex bg-[#E5E5EA] p-1 rounded-[8px] mb-2">
                      {/* 動態渲染預設球隊按鈕 */}
                      {[...PRESET_TEAMS, '自訂'].map(team => (
                        <button key={team} onClick={() => setSelectedTeam(team)} className={`flex-1 py-1.5 rounded-[6px] text-[13px] font-medium transition-all ${selectedTeam === team ? 'bg-white text-black shadow-sm' : 'text-black/60'}`}>{team}</button>
                      ))}
                    </div>
                    {selectedTeam === '自訂' && (
                      <div className="mt-1">
                        <input type="text" value={customTeam} onChange={(e) => setCustomTeam(e.target.value)} placeholder="輸入自訂球隊" className="w-full p-2 border-b border-[#E5E5EA] outline-none text-[17px] bg-transparent"/>
                        {recentCustomTeams.length > 0 && (
                          <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
                            {recentCustomTeams.map(team => (
                              <button key={team} onClick={() => setCustomTeam(team)} className="px-3 py-1.5 bg-[#F2F2F7] text-[#8E8E93] text-[13px] font-medium rounded-[8px] whitespace-nowrap active:bg-[#E5E5EA] transition-colors border border-[#E5E5EA]">
                                {team}
                              </button>
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>

                <div>
                  <h2 className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-2">打擊結果</h2>
                  <div className="bg-white p-4 rounded-[1.25rem]">
                    <div className="grid grid-cols-4 gap-3">
                      {Object.entries(OUTCOMES).filter(([key]) => key !== 'LO').map(([key, data]) => (
                        <button key={key} onClick={() => setSelectedOutcome(key)} className={`py-3 px-1 rounded-[12px] border-2 transition-all duration-200 ${selectedOutcome === key ? `${data.activeBg} ${data.activeText} border-transparent shadow-md transform scale-105` : `${data.bgColor} ${data.textColor} ${data.borderColor} active:scale-95`}`}>
                          <div className="text-[17px] font-semibold mb-0.5">{key}</div>
                          <div className="text-[10px] opacity-90">{data.label}</div>
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div>
                  <h2 className="text-[13px] text-[#8E8E93] uppercase pl-4 mb-2">打點 (RBI)</h2>
                  <div className="bg-white rounded-[1.25rem] p-1.5 flex justify-between">
                    {[0, 1, 2, 3, 4].map(num => (
                      <button key={num} onClick={() => setRbi(num)} className={`flex-1 py-2.5 text-[17px] font-medium rounded-[10px] transition-colors ${rbi === num ? 'bg-[#007AFF] text-white' : 'text-black hover:bg-[#F2F2F7]'}`}>{num}</button>
                    ))}
                  </div>
                </div>

                <div className="pt-2 space-y-3">
                  <button onClick={handleSaveRecord} disabled={!(selectedTeam === '自訂' ? customTeam.trim() : selectedTeam) || !selectedOutcome || !selectedDate || isSaving || !user} className={`w-full py-3.5 rounded-[14px] text-[17px] font-semibold flex items-center justify-center gap-2 transition-all ${(!(selectedTeam === '自訂' ? customTeam.trim() : selectedTeam) || !selectedOutcome || !selectedDate || isSaving || !user) ? 'bg-[#E5E5EA] text-[#8E8E93] cursor-not-allowed' : 'bg-[#007AFF] text-white active:bg-[#005bb5]'}`}>
                    {isEditing ? null : <Plus className="w-5 h-5" />} {isSaving ? '處理中...' : (isEditing ? '更新記錄' : '儲存記錄')}
                  </button>
                  {isEditing && (
                    <button onClick={handleCancelEdit} disabled={isSaving} className="w-full py-3.5 rounded-[14px] text-[17px] font-semibold bg-white text-[#FF3B30] border border-[#FF3B30] active:bg-[#F2F2F7] transition-all">取消修改</button>
                  )}
                </div>
              </div>
            )}

            {/* HISTORY TAB */}
            {activeTab === 'history' && (
              <div className="animate-in fade-in duration-300">
                <h2 className="text-[28px] font-bold text-black mb-4 pl-2">歷史記錄</h2>
                {records.length === 0 ? (
                  <div className="text-center py-16 text-[#8E8E93]"><p>尚無任何打擊記錄</p></div>
                ) : (
                  <div className="bg-white rounded-[1.25rem] overflow-hidden">
                    {records.map((record, index) => {
                      let outcomeData = OUTCOMES[record.outcome];
                      if (!outcomeData) {
                        if (record.outcome === 'LO') outcomeData = { label: '飛球出局', bgColor: 'bg-red-100', activeBg: 'bg-red-500' };
                        else outcomeData = { label: '未知', bgColor: 'bg-gray-100', activeBg: 'bg-gray-500' };
                      }
                      
                      const timeStr = new Date(record.timestamp).toLocaleTimeString('zh-TW', { hour: '2-digit', minute:'2-digit' });
                      return (
                        <div key={record.id} className={`p-4 flex items-center justify-between ${index !== records.length - 1 ? 'border-b border-[#E5E5EA]' : ''}`}>
                          <div className="flex items-center gap-4">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center ${outcomeData.activeBg} text-white font-semibold text-[17px]`}>
                              {record.outcome === 'LO' ? 'FO' : record.outcome}
                            </div>
                            <div>
                              <div className="font-semibold text-[16px] text-black leading-tight mb-1">{formatName(record.team)}</div>
                              <div className="text-[13px] text-[#8E8E93] flex items-center gap-1.5 mt-1">
                                <span>{record.date}</span><span>{timeStr}</span><span>{outcomeData.label}</span>
                                {record.rbi > 0 && <span className="text-[#007AFF] font-medium">• {record.rbi} 打點</span>}
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center">
                            <button onClick={() => handleEditClick(record)} className="p-2 text-[#C7C7CC] active:text-[#007AFF] transition-colors"><Pencil className="w-5 h-5" /></button>
                            <button onClick={() => handleDeleteRecord(record.id)} className="p-2 text-[#C7C7CC] active:text-[#FF3B30] transition-colors"><Trash2 className="w-5 h-5" /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* STATS TAB */}
            {activeTab === 'stats' && (
              <div className="animate-in fade-in duration-300">
                <h2 className="text-[28px] font-bold text-black mb-4 pl-2">數據統計</h2>

                <div className="flex bg-[#E5E5EA] p-1 rounded-[8px] mb-4">
                  <button onClick={() => handleViewChange('team')} className={`flex-1 py-1.5 rounded-[6px] text-[13px] font-medium transition-all ${statsView === 'team' ? 'bg-white text-black shadow-sm' : 'text-black/60'}`}>依球隊</button>
                  <button onClick={() => handleViewChange('month')} className={`flex-1 py-1.5 rounded-[6px] text-[13px] font-medium transition-all ${statsView === 'month' ? 'bg-white text-black shadow-sm' : 'text-black/60'}`}>依月份</button>
                  <button onClick={() => handleViewChange('year')} className={`flex-1 py-1.5 rounded-[6px] text-[13px] font-medium transition-all ${statsView === 'year' ? 'bg-white text-black shadow-sm' : 'text-black/60'}`}>依年份</button>
                </div>

                {statsView === 'team' && (
                  <div className="flex items-center gap-2 mb-4 px-2 overflow-x-auto whitespace-nowrap">
                    <button onClick={() => { setStatDrillTeam(null); setStatDrillMonth(null); }} className={`text-[15px] transition-opacity ${!statDrillTeam ? 'font-bold text-black' : 'text-[#007AFF] active:opacity-60'}`}>
                      所有球隊
                    </button>
                    {statDrillTeam && (
                      <div className="flex items-center gap-2">
                        <span className="text-[#8E8E93] text-[13px] font-bold">/</span>
                        <button onClick={() => setStatDrillMonth(null)} className={`text-[15px] transition-opacity ${!statDrillMonth ? 'font-bold text-black' : 'text-[#007AFF] active:opacity-60'}`}>
                          {statDrillTeam}
                        </button>
                      </div>
                    )}
                    {statDrillMonth && (
                      <div className="flex items-center gap-2">
                        <span className="text-[#8E8E93] text-[13px] font-bold">/</span>
                        <span className="text-[15px] font-bold text-black">{statDrillMonth}</span>
                      </div>
                    )}
                  </div>
                )}

                {statsView === 'month' && (
                  <div className="flex items-center gap-2 mb-4 px-2 overflow-x-auto whitespace-nowrap">
                    <button onClick={() => setStatDrillOverallMonth(null)} className={`text-[15px] transition-opacity ${!statDrillOverallMonth ? 'font-bold text-black' : 'text-[#007AFF] active:opacity-60'}`}>
                      所有月份
                    </button>
                    {statDrillOverallMonth && (
                      <div className="flex items-center gap-2">
                        <span className="text-[#8E8E93] text-[13px] font-bold">/</span>
                        <span className="text-[15px] font-bold text-black">{statDrillOverallMonth}</span>
                      </div>
                    )}
                  </div>
                )}

                {statsView === 'year' && (
                  <div className="flex items-center gap-2 mb-4 px-2 overflow-x-auto whitespace-nowrap">
                    <button onClick={() => { setStatDrillYear(null); setStatDrillYearMonth(null); }} className={`text-[15px] transition-opacity ${!statDrillYear ? 'font-bold text-black' : 'text-[#007AFF] active:opacity-60'}`}>
                      所有年份
                    </button>
                    {statDrillYear && (
                      <div className="flex items-center gap-2">
                        <span className="text-[#8E8E93] text-[13px] font-bold">/</span>
                        <button onClick={() => setStatDrillYearMonth(null)} className={`text-[15px] transition-opacity ${!statDrillYearMonth ? 'font-bold text-black' : 'text-[#007AFF] active:opacity-60'}`}>
                          {statDrillYear}
                        </button>
                      </div>
                    )}
                    {statDrillYearMonth && (
                      <div className="flex items-center gap-2">
                        <span className="text-[#8E8E93] text-[13px] font-bold">/</span>
                        <span className="text-[15px] font-bold text-black">{statDrillYearMonth}</span>
                      </div>
                    )}
                  </div>
                )}

                {(() => {
                  let currentData = [];
                  let firstColTitle = '';
                  let canDrillDown = false;
                  let onClickRow = null;

                  if (statsView === 'month') {
                    if (!statDrillOverallMonth) {
                      currentData = overallMonthlyStats; firstColTitle = '月份'; canDrillDown = true; onClickRow = (s) => setStatDrillOverallMonth(s.name);
                    } else {
                      currentData = monthTeamStats; firstColTitle = '球隊'; canDrillDown = false;
                    }
                  } else if (statsView === 'year') {
                    if (!statDrillYear) {
                      currentData = overallYearlyStats; firstColTitle = '年份'; canDrillDown = true; onClickRow = (s) => setStatDrillYear(s.name);
                    } else if (!statDrillYearMonth) {
                      currentData = yearMonthlyStats; firstColTitle = '月份'; canDrillDown = true; onClickRow = (s) => setStatDrillYearMonth(s.name);
                    } else {
                      currentData = yearMonthTeamStats; firstColTitle = '球隊'; canDrillDown = false;
                    }
                  } else {
                    if (!statDrillTeam) {
                      currentData = teamStats; firstColTitle = '球隊'; canDrillDown = true; onClickRow = (s) => setStatDrillTeam(s.name);
                    } else if (!statDrillMonth) {
                      currentData = teamMonthlyStats; firstColTitle = '月份'; canDrillDown = true; onClickRow = (s) => setStatDrillMonth(s.name);
                    } else {
                      currentData = teamDailyStats; firstColTitle = '日期'; canDrillDown = false;
                    }
                  }

                  if (currentData.length === 0) {
                    return <div className="text-center py-16 text-[#8E8E93]"><p>尚無數據可供統計</p></div>;
                  }

                  return (
                    <div className="space-y-5">
                      <div className="bg-white rounded-[1.25rem] overflow-hidden border border-[#E5E5EA]">
                        <div className="overflow-x-auto">
                          <table className="w-full text-[14px] text-left">
                            <thead className="bg-[#F9F9F9] text-[#8E8E93] font-medium border-b border-[#E5E5EA]">
                              <tr>
                                <th className="px-3 py-3 sticky left-0 bg-[#F9F9F9] z-10 font-medium border-r border-[#E5E5EA]">{firstColTitle}</th>
                                <th className="px-2 py-3 font-normal">PA</th>
                                <th className="px-2 py-3 font-normal">AB</th>
                                <th className="px-2 py-3 font-normal">H</th>
                                <th className="px-2 py-3 font-normal">HR</th>
                                <th className="px-2 py-3 font-normal text-[#007AFF]">AVG</th>
                                <th className="px-2 py-3 font-normal text-[#34C759]">OBP</th>
                                <th className="px-2 py-3 font-normal text-[#AF52DE]">OPS</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-[#E5E5EA]">
                              {currentData.map((s) => (
                                <tr key={s.name} 
                                    onClick={() => { if (onClickRow) onClickRow(s); }}
                                    className={`bg-white transition-colors ${canDrillDown ? 'cursor-pointer active:bg-[#E5E5EA]' : ''}`}>
                                  <td className="px-3 py-3 sticky left-0 bg-inherit font-semibold text-black z-10 whitespace-nowrap border-r border-[#E5E5EA]">
                                    <div className="flex items-center justify-between gap-2">
                                      {formatName(s.name)}
                                      {canDrillDown && <ChevronRight className="w-4 h-4 text-[#C7C7CC] shrink-0" />}
                                    </div>
                                  </td>
                                  <td className="px-2 py-3 text-black">{s.PA}</td>
                                  <td className="px-2 py-3 text-black">{s.AB}</td>
                                  <td className="px-2 py-3 text-black">{s.H}</td>
                                  <td className="px-2 py-3 text-black">{s.HR}</td>
                                  <td className="px-2 py-3 font-semibold text-[#007AFF]">{s.AVG}</td>
                                  <td className="px-2 py-3 font-semibold text-[#34C759]">{s.OBP}</td>
                                  <td className="px-2 py-3 font-semibold text-[#AF52DE]">{s.OPS}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* 渲染圖表區塊 */}
                      {(() => {
                        if (
                          (statsView === 'team' && !statDrillTeam) || 
                          (statsView === 'month' && statDrillOverallMonth) ||
                          (statsView === 'year' && statDrillYearMonth)
                        ) {
                          return renderGroupedBarChart(currentData);
                        }
                        
                        if (
                          (statsView === 'month' && !statDrillOverallMonth) || 
                          (statsView === 'team' && statDrillTeam && !statDrillMonth) ||
                          (statsView === 'year' && !statDrillYearMonth)
                        ) {
                          if (currentData.length < 2) {
                            return <p className="text-center text-[13px] text-[#8E8E93] py-4">* 累積兩筆以上的資料即可解鎖趨勢圖</p>;
                          }
                          return (
                            <div className="space-y-4">
                              {renderLineChart(currentData, 'AVG', '打擊率 (AVG)', '#007AFF')}
                              {renderLineChart(currentData, 'OBP', '上壘率 (OBP)', '#34C759')}
                              {renderLineChart(currentData, 'OPS', '攻擊指數 (OPS)', '#AF52DE')}
                            </div>
                          );
                        }

                        return null;
                      })()}
                    </div>
                  );
                })()}
              </div>
            )}
          </main>

          <nav className="bg-white/80 backdrop-blur-md border-t border-[#E5E5EA] flex justify-around items-center pb-safe absolute bottom-0 w-full max-w-md h-[83px]">
            <button onClick={() => setActiveTab('record')} className={`flex-1 flex flex-col items-center justify-center gap-1 transition-colors mt-2 mb-auto ${activeTab === 'record' ? 'text-[#007AFF]' : 'text-[#8E8E93]'}`}>
              <ClipboardList className={`w-[26px] h-[26px] ${activeTab === 'record' ? 'stroke-[2.5px]' : 'stroke-[2px]'}`} />
              <span className="text-[10px] font-medium">記錄</span>
            </button>
            <button onClick={() => setActiveTab('history')} className={`flex-1 flex flex-col items-center justify-center gap-1 transition-colors mt-2 mb-auto ${activeTab === 'history' ? 'text-[#007AFF]' : 'text-[#8E8E93]'}`}>
              <HistoryIcon className={`w-[26px] h-[26px] ${activeTab === 'history' ? 'stroke-[2.5px]' : 'stroke-[2px]'}`} />
              <span className="text-[10px] font-medium">歷史</span>
            </button>
            <button onClick={() => setActiveTab('stats')} className={`flex-1 flex flex-col items-center justify-center gap-1 transition-colors mt-2 mb-auto ${activeTab === 'stats' ? 'text-[#007AFF]' : 'text-[#8E8E93]'}`}>
              <BarChart2 className={`w-[26px] h-[26px] ${activeTab === 'stats' ? 'stroke-[2.5px]' : 'stroke-[2px]'}`} />
              <span className="text-[10px] font-medium">數據</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
